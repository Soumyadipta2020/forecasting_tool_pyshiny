[project]
name = "forecasting-tool-pyshiny"
version = "0.2.0"
description = "A PyShiny forecasting workbench for data quality, model comparison, validation, and reporting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "shiny>=0.5.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "plotly>=5.18.0",
    "shinywidgets>=0.8.1",
    "prophet>=1.1.0",
    "statsmodels>=0.13.0",
    "scikit-learn>=1.2.2",
    "scipy>=1.10.1",
    "arch>=6.3.0",
    "uvicorn>=0.17.0",
    "requests>=2.28.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
